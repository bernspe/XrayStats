# Aus der PI abgeleitete Ziele: target = a·PI + b; resid_sd = Streuung um die Zielgerade (falls bekannt)
pi_targets:
  L1PA:
    - {source: Hills2022, a: 0.5, b: -21.0, resid_sd: null, note: "Normalbeziehung r² = 0,58"}
    - {source: Hills2022, a: 0.5, b: -19.0, resid_sd: 2.0, note: "Zielbereich minimales mechanisches Versagen: 0,5·PI − (19 ± 2)°"}
  SS:
    - {source: GAP_Yilgor2017, a: 0.59, b: 9.0, resid_sd: null, note: "ideale SS"}
  LL:
    - {source: GAP_Yilgor2017, a: 0.62, b: 29.0, resid_sd: null, note: "ideale LL, R² = 0,39"}

# Feste Zielbereiche
target_ranges:
  T4L1PA_mismatch: {source: Hills2022, low: -3.0, high: 1.0, note: "Mismatch mit minimalem Versagensrisiko"}
  LDI: {source: GAP_Yilgor2017, low: 50.0, high: 80.0, unit: "%", note: "L4–S1 / L1–S1 × 100"}

# Klassifikationen: Schwellen aufsteigend, labels eins mehr als thresholds
classifications:
  schwab_PI_LL: {source: SRS_Schwab, param: PI_LL, thresholds: [10.0, 20.0], labels: ["0", "+", "++"]}
  schwab_PT: {source: SRS_Schwab, param: PT, thresholds: [20.0, 30.0], labels: ["0", "+", "++"]}
  roussouly_theoretical: {source: Roussouly, param: SS_ideal, thresholds: [35.0, 45.0], labels: ["1/2", "3", "4"],
                          note: "theoretischer Typ aus idealer SS (GAP) statt gemessener SS"}
  roussouly_measured: {source: Roussouly, param: SS, thresholds: [35.0, 45.0], labels: ["1/2", "3", "4"]}
