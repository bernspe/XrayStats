# Normwerte und Zielformeln (Spec §3.4, §3.6, Phase 4). Nie im Code hart kodieren.
#
# Konventionen (wie spine_geom.sagittal): Winkel in Grad, LL (L1–S1) als positive Lordose,
# VPAs positiv = Centroid anterior der Linie Hüftachse → S1-Mitte, SVA in mm (unsere Messung: WKD!).
# verified: true = Wert gegen Original/Abstract geprüft; false = aus der Spec übernommen, ungeprüft.
#
# Standard: MEANS (multiethnisch). Alters-/Geschlechtsstrata: Yukawa 2018 (Nutzerentscheidung 2026-09-29).
# Ergänzt (2026-09-29, PDFs vom Nutzer): Wang 2025 (Altersstrata ≥ 50 J., LL L1–S1), Gharbi 2024 (koronar,
# T1PA/GT mit SD). Rang: Alters+Geschlechtsstratum > Altersstratum > Gesamtnorm; Gleichstand → mit SD vor
# ohne SD, dann Reihenfolge in der Liste. Altersgrenzen halboffen: age: [lo, hi] heißt lo ≤ Alter < hi.

sources:
  MEANS_spinopelvic:
    citation: "Sardar ZM et al. Age and Gender Based Spinopelvic and Regional Spinal Alignment in Asymptomatic Adult Volunteers: Results of MEANS. Spine 2022;47(19):1382-1390. doi:10.1097/BRS.0000000000004415"
    population: "asymptomatisch, multiethnisch (FR, JP, SG, TN, US), EOS stehend"
    n: 468
    age_range: [18, 80]
    verified: true   # Abstract via Europe PMC
  MEANS_global:
    citation: "Sardar ZM et al. Age- and Gender-based Global Sagittal Spinal Alignment in Asymptomatic Adult Volunteers: Results of MEANS. Spine 2022;47(19):1372-1381. doi:10.1097/BRS.0000000000004413"
    population: "wie MEANS_spinopelvic"
    n: 468
    age_range: [18, 80]
    verified: true
  Yukawa2018:
    citation: "Yukawa Y et al. Normative data for parameters of sagittal spinal alignment in healthy subjects: an analysis of gender specific differences and changes with aging in 626 asymptomatic individuals. Eur Spine J 2018. doi:10.1007/s00586-016-4807-7"
    population: "asymptomatisch, Japan, Ganzwirbelsäule stehend, Röntgen; ≥ 48 je Geschlecht und Dekade (20er–70er); Übergangsanomalien ausgeschlossen"
    n: 626
    age_range: [20, 80]
    verified: true   # Volltext-PDF, Tabellen 1, 4–8 (Nutzer, 2026-09-29)
  Wang2025:
    citation: "Wang W et al. Age-Related Changes and Spinal Sagittal Alignment in Asymptomatic Community-Dwelling Adults Over 50. Spine 2025;50(21):E431-E437. doi:10.1097/BRS.0000000000005248"
    population: "asymptomatisch, Community-Kohorte Peking (Han-chinesisch), ≥ 50 J., 60 % weiblich, Röntgen stehend"
    n: 701
    age_range: [50, 90]
    verified: true   # Volltext-PDF, Tabelle 2; n je Altersgruppe nicht angegeben
  Gharbi2024:
    citation: "Gharbi A et al. Coronal alignment in normal individuals and moderate scoliosis: Normative values, variation with age and comparison with sagittal alignment. Brain and Spine 2024;4:103917. doi:10.1016/j.bas.2024.103917"
    population: "EOS stehend, Frankreich (Straßburg/Bordeaux), N-Gruppe ohne Skoliose n = 236, Alter 6–89 J.; koronare Werte als Beträge"
    n: 236
    age_range: [6, 90]
    verified: true   # Volltext-PDF, Tabellen 1, 2, 4, 5
  Hills2022:
    citation: "Hills J et al. The T4-L1-Hip Axis. Spine 2022. PMID 35867583 (Werte laut Spec §3.4)"
    population: "asymptomatisch bzw. operierte ASD-Kohorte (Zielbereich)"
    n: null
    age_range: null
    verified: false
  GAP_Yilgor2017:
    citation: "Yilgor C et al. Global Alignment and Proportion (GAP) Score, 2017 (Werte laut Spec §3.4)"
    population: "ASD, operativ"
    n: null
    age_range: null
    verified: false
  SRS_Schwab:
    citation: "SRS-Schwab-Klassifikation (Werte laut Spec §3.2)"
    population: "ASD"
    n: null
    age_range: null
    verified: false
  Roussouly:
    citation: "Roussouly-Typen (Werte laut Spec §3.4)"
    population: "asymptomatisch"
    n: null
    age_range: null
    verified: false

